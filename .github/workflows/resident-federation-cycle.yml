name: Resident Federation Cycle

# The in-tree dispatcher the activation manifest binds in epoch_bindings. It
# runs the resident cycle entrypoint (federation_cycle.py) and the ecosystem
# status (ecosystem_control.py) at the dispatched hb_epoch. Only
# workflow_dispatch invokes it: no push, pull_request or schedule trigger runs
# an epoch-requiring entrypoint without an epoch.
#
# The mesh and both ledger roots are runner-temporary. Nothing is pushed and
# the receipts are not production receipts.
on:
  workflow_dispatch:
    inputs:
      hb_epoch:
        description: 'required heartbeat epoch: ASCII digits, value >= 32; never derived from the clock'
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The dispatch hb_epoch is checked by the kernel's shared rule before any
      # entrypoint runs. A workflow_dispatch string input cannot tell empty
      # from absent, so "" is HB_EPOCH_NOT_SUPPLIED; an invalid one is
      # HB_EPOCH_INVALID. Either is the six-field writer_epoch_refusal, nothing
      # runs, and no clock is read.
      - name: Refuse an absent or invalid dispatch hb_epoch by the kernel's shared rule
        env:
          HB_EPOCH: ${{ github.event.inputs.hb_epoch }}
        run: |
          python - <<'PY'
          import importlib.util, json, os, sys
          spec = importlib.util.spec_from_file_location("kernel", "org-kernel/kernel.py")
          kernel = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(kernel)
          refusal = kernel.writer_epoch_refusal(
              os.environ.get("HB_EPOCH") or None,
              retry_entrypoint=".github/workflows/resident-federation-cycle.yml (workflow_dispatch hb_epoch)")
          if refusal is not None:
              print(json.dumps(refusal, sort_keys=True))
              sys.exit(1)
          print("DISPATCH_HB_EPOCH=SUPPLIED")
          PY

      - name: Run the resident federation cycle at the dispatched epoch
        env:
          HB_EPOCH: ${{ github.event.inputs.hb_epoch }}
          STEGVERSE_ORG_FEDERATION_ROOT: ${{ runner.temp }}/federation-mesh
          STEGVERSE_REPO_LEDGER_ROOT: ${{ runner.temp }}/repo-ledger
          STEGVERSE_ORG_LEDGER_ROOT: ${{ runner.temp }}/org-ledger
        run: |
          python resident-runtime/federation_cycle.py --hb-epoch "$HB_EPOCH"

      - name: Report the resident status at the dispatched epoch
        env:
          HB_EPOCH: ${{ github.event.inputs.hb_epoch }}
          STEGVERSE_ORG_FEDERATION_ROOT: ${{ runner.temp }}/federation-mesh
        run: |
          python resident-runtime/ecosystem_control.py status --hb-epoch "$HB_EPOCH"
