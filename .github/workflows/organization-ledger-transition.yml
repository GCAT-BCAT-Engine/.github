name: Organization Ledger Transition

# The published organization ledger is refs/stegverse/organization-ledger
# (org-contract.json organization_ledger_ref). workflow_dispatch records an
# intr-destination diagnostic self-closure on that ref, fast-forward pushes
# it, and reads the receipts back from a fresh fetch.
#
# pull_request and push only exercise redirected stores. Those stores are not
# the published ref, and the receipts they hold are not production receipts.
# Writer only (workflow_dispatch). The pull_request checks of this writer run in
# .github/workflows/organization-ledger-transition-validation.yml, so a pull request
# never shows this dispatch-only job as skipped and no PR run holds contents: write.
on:
  workflow_dispatch:
    inputs:
      communication_id:
        description: 'communication_id the diagnostic self-closure records'
        required: true
      packet_id:
        description: 'optional packet id; default intr-destination-self-closure:<communication_id>'
        required: false
        default: ''
      hb_epoch:
        description: 'optional heartbeat epoch; empty derives one from the clock'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: organization-ledger
      cancel-in-progress: false
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate dispatch inputs and the ledger contract
        env:
          COMMUNICATION_ID: ${{ github.event.inputs.communication_id }}
          PACKET_ID: ${{ github.event.inputs.packet_id }}
          HB_EPOCH: ${{ github.event.inputs.hb_epoch }}
        run: |
          python - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          def printable(name, value, required):
              if required and not value:
                  print("FAIL_CLOSED: " + name + "_REQUIRED", file=sys.stderr)
                  sys.exit(1)
              if value and not all(32 <= ord(character) <= 126 for character in value):
                  print("FAIL_CLOSED: " + name + "_NOT_PRINTABLE", file=sys.stderr)
                  sys.exit(1)
          printable("COMMUNICATION_ID", os.environ.get("COMMUNICATION_ID") or "", True)
          printable("PACKET_ID", os.environ.get("PACKET_ID") or "", False)
          epoch = os.environ.get("HB_EPOCH") or ""
          printable("HB_EPOCH", epoch, False)
          if epoch and not re.fullmatch(r"[0-9]+", epoch):
              print("FAIL_CLOSED: HB_EPOCH_NOT_AN_INTEGER", file=sys.stderr)
              sys.exit(1)
          org = json.loads(Path(".stegverse/transition-ledger/org-contract.json").read_text())
          repo = json.loads(Path(".stegverse/transition-ledger/contract.json").read_text())["repository_ledger_location"]
          assert org["organization_ledger_repository"] == "GCAT-BCAT-Engine/.github"
          assert org["organization_ledger_ref"] == "refs/stegverse/organization-ledger"
          assert repo["ref"] == org["organization_ledger_ref"]
          assert repo["namespace"]
          assert repo["new_ledger_root"] is False
          print("DISPATCH_INPUTS_AND_CONTRACT=PASS")
          PY

      - name: Bind the designated organization ledger ref and the repository ledger subtree within it
        run: |
          ref=$(python -c 'import json; c=json.load(open(".stegverse/transition-ledger/org-contract.json")); assert c["organization_ledger_repository"]=="GCAT-BCAT-Engine/.github", c; print(c["organization_ledger_ref"])')
          test "$ref" = "$LEDGER_REF"
          namespace=$(python -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          echo "repository ledger subtree: $namespace"
          if git ls-remote --exit-code origin "$LEDGER_REF" >/dev/null; then
            git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
            echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          else
            echo "ledger ref not yet materialized; the first append opens it at genesis"
          fi

      - name: Record the intr-destination diagnostic self-closure
        env:
          COMMUNICATION_ID: ${{ github.event.inputs.communication_id }}
          PACKET_ID: ${{ github.event.inputs.packet_id }}
          HB_EPOCH: ${{ github.event.inputs.hb_epoch }}
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          mkdir -p "$RUNNER_TEMP/results"
          args=(
            --self-close
            --communication-id "$COMMUNICATION_ID"
            --registry org-boundary/registry/services.json
            --out "$RUNNER_TEMP/results/closure.json"
          )
          if [ -n "${PACKET_ID:-}" ]; then
            args+=(--packet-id "$PACKET_ID")
          fi
          if [ -n "${HB_EPOCH:-}" ]; then
            args+=(--hb-epoch "$HB_EPOCH")
          fi
          python resident-runtime/intr_destination_ingress.py "${args[@]}"
          python - <<'PY'
          import json, os
          result = json.load(open(os.environ["RUNNER_TEMP"] + "/results/closure.json"))
          if result.get("disposition") != "ALLOW" or result.get("self_closure") is not True:
              raise SystemExit(json.dumps(result, sort_keys=True))
          if not result.get("communication_id"):
              raise SystemExit("self-closure result has no communication_id")
          if result.get("organization_receipt_preserves_repository_receipt") is not True:
              raise SystemExit("organization receipt does not preserve the repository receipt")
          print("self-closure disposition ALLOW", result["communication_id"])
          PY

      - name: Publish the ledger ref (fast-forward only)
        run: |
          if ! git rev-parse --verify --quiet "$LEDGER_REF" >/dev/null; then
            echo "nothing appended; ledger ref not materialized"
            exit 0
          fi
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"ORGANIZATION-ROLE-RUNTIME-REALITY-DEPLOYMENT-001","next_attempt":"re-run the same communication_id; a recorded diagnostic is returned instead of minted again","authority_effect":"NONE_REFUSAL_ONLY"}'
            exit 1
          fi
          echo "ledger ref published: $LEDGER_REF $(git rev-parse "$LEDGER_REF")"

      - name: Read the organization and repository ledgers back from a fresh fetch
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"AUTHENTICATED_LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_AUTHENTICATED","required_evidence_or_repair":"checkout credentials unavailable for independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"ORGANIZATION-ROLE-RUNTIME-REALITY-DEPLOYMENT-001","next_attempt":"retry with an authorized contents token","authority_effect":"NONE_READBACK_ONLY"}'
            exit 1
          fi
          git --git-dir="$fresh" -c http.https://github.com/.extraheader="$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          python resident-runtime/organization_ledger_readback.py \
            --location "git+$fresh#$LEDGER_REF" \
            --ingress-result "$RUNNER_TEMP/results/closure.json" \
            --repository-namespace "$REPO_LEDGER_NAMESPACE" \
            --out "$RUNNER_TEMP/results/readback.json"
          {
            echo '### intr-destination self-closure'
            echo '```json'
            cat "$RUNNER_TEMP/results/readback.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organization-ledger-transition
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
