name: Org Boundary Execution
on:
  push:
    paths: ['org-boundary/**','.github/workflows/org-boundary-execution.yml']

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 org-boundary/tests/test_process_boundary.py
